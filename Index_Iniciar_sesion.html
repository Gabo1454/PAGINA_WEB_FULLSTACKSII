<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Level-Up Gamer</title>
  <link rel="stylesheet" href="CssSesion/Sesion.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Roboto&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <img src="../img/logo_level_up-removebg-preview.png" alt="Logo Level-Up Gamer" class="logo-login" />
      <h2>Iniciar Sesión</h2>
      <form id="formLogin">
        <input type="text" id="nombreUsuario" placeholder="Nombre de usuario" required />
        <input type="password" id="claveUsuario" placeholder="Contraseña" required />
        <button type="submit">Ingresar</button>
      </form>
      <p class="mensaje-error" id="mensajeError"></p>
    </div>
  </div>

  <script src="JsSesion/ScriptsSesion.js"></script>
</body>
</html>
