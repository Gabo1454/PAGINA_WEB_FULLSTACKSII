<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del producto</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="cssTienda/tienda.css" />
    <link rel="stylesheet" href="css/detalle-producto.css" />

      <!--Contenido adaptable a anchos de dispositivos-->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  </head>
  <body class="detalle-page">
    <header class="header-principal">
      <div class="logo-web">
        <img
          src="img/logo_level_up-removebg-preview.png"
          alt="Logo Level-Up Gamer"
          width="120"
          height="140"
        />
      </div>

      <nav class="nav-bar">
        <a href="index.html" class="nav-item"
          ><i class="fa fa-house"></i><span>Home</span></a
        >
        <a href="catalogo.html" class="nav-item"
          ><i class="fa fa-gamepad"></i><span>Productos</span></a
        >
        <a href="nosotros.html" class="nav-item"
          ><i class="fa fa-user"></i><span>Nosotros</span></a
        >
        <a href="blogs.html" class="nav-item"
          ><i class="fa fa-file-lines"></i><span>Blogs</span></a
        >
        <a href="contacto.html" class="nav-item"
          ><i class="fa fa-envelope"></i><span>Contacto</span></a
        >
        <a href="Index_Iniciar_sesion.html" class="nav-item"
          ><i class="fa fa-right-to-bracket"></i><span>Iniciar Sesión</span></a
        >
        <a href="index_Login.html" class="nav-item"
          ><i class="fa fa-user-plus"></i><span>Registrarse</span></a
        >
      </nav>

      <!-- Carrito y búsqueda -->
      <nav class="nav-carrito">
        <div class="busqueda-wrapper">
          <input
            type="text"
            id="busqueda"
            class="barra-busqueda"
            placeholder="Buscar productos..."
          />
          <i class="fa fa-search icono-lupa" onclick="toggleBusqueda()"></i>
        </div>
        <a href="index_carrito.html" class="nav-item">
          <i class="fa fa-shopping-cart"></i>
          <span>Carrito (<span id="contador-carrito">0</span>)</span>
        </a>
      </nav>
    </header>

    <main class="detalle-producto-page">
      <section class="detalle-producto">
        <img id="detalle-img" src="" alt="Producto" width="300" />
        <div class="detalle-info">
          <h1 id="detalle-nombre"></h1>
          <p id="detalle-descripcion"></p>
          <span id="detalle-precio"></span>
          <button id="detalle-agregar" class="btn-agregar">
            Añadir al carrito
          </button>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-contenido">
        <div class="logo-web">
          <img
            src="img/logo_level_up-removebg-preview.png"
            alt="Logo Level-Up Gamer"
            width="120"
            height="140"
          />
        </div>
        <div class="footer-contacto">
          <h2><strong>Contacto</strong></h2>
          <p><strong>Direccion:</strong> Av. Brasil 2021, Valparaíso</p>
          <p><strong>Teléfono</strong> +569 20141234</p>
          <p><strong>Email</strong> contacto@levelup.cl</p>
        </div>

        <!-- Newsletter -->
        <div class="newsletter">
          <h2>Suscríbete a nuestro Newsletter</h2>
          <form id="newsletter-form">
            <input
              type="email"
              id="correo-newsletter"
              placeholder="Ingresa tu correo"
              required
            />
            <button type="submit">Suscribirse</button>
          </form>
          <p id="mensaje-newsletter"></p>
        </div>

        <h4>Síguenos en redes sociales</h4>
        <div class="redes-sociales">
          <a href="https://facebook.com" target="_blank"
            ><i class="fab fa-facebook"></i
          ></a>
          <a href="https://instagram.com" target="_blank"
            ><i class="fab fa-instagram"></i
          ></a>
          <a href="https://twitter.com" target="_blank"
            ><i class="fab fa-twitter"></i
          ></a>
        </div>

        <p>&copy; 2027 Level-Up Gamer. Todos los derechos reservados.</p>
      </div>
    </footer>

    <script src="js/detalle.js"></script>
  </body>
</html>
