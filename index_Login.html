<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Level-Up Gamer</title>

  <!-- Tipografías requeridas -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cssLogin/styles_Login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!--Contenido adaptable a anchos de dispositivos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
</head>
<body>
  <div class="login-wrapper">
    <div class="logo-login">
      <img src="img/logo_level_up-removebg-preview.png" alt="Logo Level-Up Gamer" width="120" height="120" />
    </div>

    <h2 class="encabezado">Registro</h2>

    <form id="formulario-registro">
      <label for="nombre">Nombre de usuario</label>
      <input type="text" id="nombre" required placeholder="Ej: GamerPro" />

      <label for="clave">Crear contraseña</label>
      <input type="password" id="clave" required placeholder="Mínimo 6 caracteres" />

      <label for="fecha">Fecha de Nacimiento</label>
      <input type="date" id="fecha" required />

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required placeholder="ejemplo@duoc.cl" />

      <label for="referido">Código de Referido (opcional)</label>
      <input type="text" id="referido" placeholder="Ej: ABC123" />

      <button type="button" onclick="agregarPersona()">Registrarse</button>
    </form>

    <p>Total de Personas: <span id="contador">0</span></p>

    <div id="lista-personas"></div>
    <div id="mensaje-descuento" class="descuento-oculto"></div>
  </div>

  <script src="JsLogin/ScriptsLogin.js"></script>
</body>
</html>
